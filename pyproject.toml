[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "dataset-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2",
    "opencv-python>=4.10",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "maturin>=1.9.4,<2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.maturin]
python-source = "python"
module-name = "dataset_automation._core"

[tool.uv]
# Rebuild the Rust extension on `uv sync` when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
]

[tool.pytest.ini_options]
filterwarnings = ["error::RuntimeWarning"]
testpaths = ["tests"]
# importlib mode lets each package keep its own tests/<package>/test_*.py without name clashes.
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
src = ["python"]
extend-exclude = ["docs"]

[tool.pyright]
include = ["python", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
